[package]
name = "loose-ends-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"

[features]
neural = []

[[bin]]
name = "eval_rust"
path = "src/bin/eval_rust.rs"
required-features = ["neural"]
